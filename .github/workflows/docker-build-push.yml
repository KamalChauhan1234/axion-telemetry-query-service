# .github/workflows/ci.yml
# Telemetry service - image build, ACR push, aur isi repo ke manifests/deployment.yaml
# ka image tag update karke commit-push karega (ArgoCD isi repo ko watch kar raha hoga)

name: CI - Build, Push and Update Manifest

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'manifest/**'   # important: warna CI khud ka commit dekh kar dobara trigger ho jaayega (infinite loop)
      - '**.md'

env:
  ACR_LOGIN_SERVER: acrdevtodoacr.azurecr.io
  IMAGE_NAME: telemetry
  MANIFEST_PATH: manifest/deployment.yaml   # apna actual folder-name check kar lena

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # taki push karte waqt full history mile

      - name: Set image tag (git short SHA)
        id: vars
        run: echo "image_tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: az acr login --name ${{ env.ACR_LOGIN_SERVER }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Image to ACR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.image_tag }}
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest

      - name: Update image tag in deployment.yaml
        run: |
          sed -i "s|image: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:.*|image: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.image_tag }}|" ${{ env.MANIFEST_PATH }}
          cat ${{ env.MANIFEST_PATH }}

      - name: Commit and push updated manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ${{ env.MANIFEST_PATH }}
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "chore: update telemetry image to ${{ steps.vars.outputs.image_tag }} [skip ci]"
          git push
